# cc-proxy 配置（测试用）
# 此文件包含占位符密钥，不用于生产

proxy:
  listen: "127.0.0.1"
  port: 15721
  mode: "global"

failover:
  enabled: true
  auto_switch: true

logging:
  level: "debug"

providers:
  - name: test-provider
    type: openai_chat
    api_key: YOUR_API_KEY_HERE
    base_url: https://api.example.com
    models:
      - claude-sonnet-4-5
    priority: 1
    enabled: true