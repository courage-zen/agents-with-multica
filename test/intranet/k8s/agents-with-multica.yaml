---
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-token
  namespace: eda-bigdata
type: Opaque
stringData:
  token: "QXSdVU4845WHTuwUxgRK"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agents-with-multica-amd64
  namespace: eda-bigdata
  labels:
    app: agents-with-multica-amd64
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agents-with-multica-amd64
  template:
    metadata:
      labels:
        app: agents-with-multica-amd64
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
      - name: agent
        image: reg.telecomjs.com/eda-bigdata/agents-with-multica-npm:0.2.1-amd64
        securityContext:
          privileged: true
        env:
        - name: MULTICA_AGENT_RUNTIME_NAME
          value: "k8s-agent-37-amd64"
        - name: MULTICA_DAEMON_DEVICE_NAME
          value: "k8s-agent-37-amd64"
        - name: MULTICA_DAEMON_ID
          value: "k8s-37-amd64-0.2.1-20260521"
        - name: GIT_HOST
          value: "gitlab.telecomjs.com:8443"
        - name: GIT_TOKEN
          valueFrom:
            secretKeyRef:
              name: gitlab-token
              key: token
        - name: GIT_USERNAME
          value: "oauth2"
        volumeMounts:
        - name: multica-config
          mountPath: /etc/multica/config.json
          subPath: multica-config.json
          readOnly: true
        - name: cc-proxy-config
          mountPath: /home/agent/.cc-proxy/config.yaml
          subPath: cc-proxy-config.yaml
          readOnly: true
      imagePullSecrets:
      - name: reg-telecomjs-secret
      volumes:
      - name: multica-config
        configMap:
          name: agents-multica-config
      - name: cc-proxy-config
        configMap:
          name: agents-multica-config
---
