name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'base/binary/**'
      - 'base/npm/**'
      - 'versions.yaml'
      - '.github/workflows/build.yml'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'base/binary/**'
      - 'base/npm/**'
      - 'versions.yaml'
      - '.github/workflows/build.yml'

jobs:
  build-binary:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') || github.event_name == 'pull_request'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract versions
        id: versions
        run: |
          PROJECT_VERSION=$(python3 -c "import yaml; print(yaml.safe_load(open('versions.yaml'))['project']['version'])")
          CC_PROXY_VERSION=$(python3 -c "import yaml; print(yaml.safe_load(open('versions.yaml'))['cc_proxy']['version'])")
          MULTICA_VERSION=$(python3 -c "import yaml; print(yaml.safe_load(open('versions.yaml'))['multica']['version'])")
          CLAUDE_CODE_VERSION=$(python3 -c "import yaml; print(yaml.safe_load(open('versions.yaml'))['claude_code']['version'])")
          echo "PROJECT_VERSION=$PROJECT_VERSION" >> $GITHUB_OUTPUT
          echo "CC_PROXY_VERSION=$CC_PROXY_VERSION" >> $GITHUB_OUTPUT
          echo "MULTICA_VERSION=$MULTICA_VERSION" >> $GITHUB_OUTPUT
          echo "CLAUDE_CODE_VERSION=$CLAUDE_CODE_VERSION" >> $GITHUB_OUTPUT

      - name: Build amd64
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./base/binary/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/courage-zen/agents-with-multica:latest-amd64
            ghcr.io/courage-zen/agents-with-multica:${{ steps.versions.outputs.PROJECT_VERSION }}-amd64
          build-args: |
            CC_PROXY_VERSION=${{ steps.versions.outputs.CC_PROXY_VERSION }}
            MULTICA_VERSION=${{ steps.versions.outputs.MULTICA_VERSION }}
            CLAUDE_CODE_VERSION=${{ steps.versions.outputs.CLAUDE_CODE_VERSION }}

      - name: Build arm64
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./base/binary/Dockerfile
          platforms: linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/courage-zen/agents-with-multica:latest-arm64
            ghcr.io/courage-zen/agents-with-multica:${{ steps.versions.outputs.PROJECT_VERSION }}-arm64
          build-args: |
            CC_PROXY_VERSION=${{ steps.versions.outputs.CC_PROXY_VERSION }}
            MULTICA_VERSION=${{ steps.versions.outputs.MULTICA_VERSION }}
            CLAUDE_CODE_VERSION=${{ steps.versions.outputs.CLAUDE_CODE_VERSION }}

  build-npm:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') || github.event_name == 'pull_request'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract versions
        id: versions
        run: |
          PROJECT_VERSION=$(python3 -c "import yaml; print(yaml.safe_load(open('versions.yaml'))['project']['version'])")
          CC_PROXY_VERSION=$(python3 -c "import yaml; print(yaml.safe_load(open('versions.yaml'))['cc_proxy']['version'])")
          MULTICA_VERSION=$(python3 -c "import yaml; print(yaml.safe_load(open('versions.yaml'))['multica']['version'])")
          CLAUDE_CODE_VERSION=$(python3 -c "import yaml; print(yaml.safe_load(open('versions.yaml'))['claude_code']['version'])")
          echo "PROJECT_VERSION=$PROJECT_VERSION" >> $GITHUB_OUTPUT
          echo "CC_PROXY_VERSION=$CC_PROXY_VERSION" >> $GITHUB_OUTPUT
          echo "MULTICA_VERSION=$MULTICA_VERSION" >> $GITHUB_OUTPUT
          echo "CLAUDE_CODE_VERSION=$CLAUDE_CODE_VERSION" >> $GITHUB_OUTPUT

      - name: Build amd64
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./base/npm/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/courage-zen/agents-with-multica-npm:latest-amd64
            ghcr.io/courage-zen/agents-with-multica-npm:${{ steps.versions.outputs.PROJECT_VERSION }}-amd64
          build-args: |
            CC_PROXY_VERSION=${{ steps.versions.outputs.CC_PROXY_VERSION }}
            MULTICA_VERSION=${{ steps.versions.outputs.MULTICA_VERSION }}
            CLAUDE_CODE_VERSION=${{ steps.versions.outputs.CLAUDE_CODE_VERSION }}

      - name: Build arm64
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./base/npm/Dockerfile
          platforms: linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/courage-zen/agents-with-multica-npm:latest-arm64
            ghcr.io/courage-zen/agents-with-multica-npm:${{ steps.versions.outputs.PROJECT_VERSION }}-arm64
          build-args: |
            CC_PROXY_VERSION=${{ steps.versions.outputs.CC_PROXY_VERSION }}
            MULTICA_VERSION=${{ steps.versions.outputs.MULTICA_VERSION }}
            CLAUDE_CODE_VERSION=${{ steps.versions.outputs.CLAUDE_CODE_VERSION }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract versions
        id: version
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          echo "TAG_VERSION=$TAG_VERSION" >> $GITHUB_OUTPUT
          CODE_WRITER_TS_VERSION=$(python3 -c "import yaml; print(yaml.safe_load(open('code-writer-version.yaml'))['code_writer_ts']['version'])")
          echo "CODE_WRITER_TS_VERSION=$CODE_WRITER_TS_VERSION" >> $GITHUB_OUTPUT
          CODE_WRITER_GO_VERSION=$(python3 -c "import yaml; print(yaml.safe_load(open('code-writer-version.yaml'))['code_writer_go']['version'])")
          echo "CODE_WRITER_GO_VERSION=$CODE_WRITER_GO_VERSION" >> $GITHUB_OUTPUT
          CODE_WRITER_PY_VERSION=$(python3 -c "import yaml; print(yaml.safe_load(open('code-writer-version.yaml'))['code_writer_py']['version'])")
          echo "CODE_WRITER_PY_VERSION=$CODE_WRITER_PY_VERSION" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and save binary images
        run: |
          docker pull --platform linux/amd64 ghcr.io/courage-zen/agents-with-multica:${{ steps.version.outputs.TAG_VERSION }}-amd64
          docker save ghcr.io/courage-zen/agents-with-multica:${{ steps.version.outputs.TAG_VERSION }}-amd64 | gzip > agents-with-multica-amd64.tar.gz

          docker pull --platform linux/arm64 ghcr.io/courage-zen/agents-with-multica:${{ steps.version.outputs.TAG_VERSION }}-arm64
          docker save ghcr.io/courage-zen/agents-with-multica:${{ steps.version.outputs.TAG_VERSION }}-arm64 | gzip > agents-with-multica-arm64.tar.gz

      - name: Pull and save npm images
        run: |
          docker pull --platform linux/amd64 ghcr.io/courage-zen/agents-with-multica-npm:${{ steps.version.outputs.TAG_VERSION }}-amd64
          docker save ghcr.io/courage-zen/agents-with-multica-npm:${{ steps.version.outputs.TAG_VERSION }}-amd64 | gzip > agents-with-multica-npm-amd64.tar.gz

          docker pull --platform linux/arm64 ghcr.io/courage-zen/agents-with-multica-npm:${{ steps.version.outputs.TAG_VERSION }}-arm64
          docker save ghcr.io/courage-zen/agents-with-multica-npm:${{ steps.version.outputs.TAG_VERSION }}-arm64 | gzip > agents-with-multica-npm-arm64.tar.gz

      - name: Pull and save code-writer-ts images
        run: |
          docker pull --platform linux/amd64 ghcr.io/courage-zen/agents-with-multica-code-writer-ts:${{ steps.version.outputs.CODE_WRITER_TS_VERSION }}-amd64
          docker save ghcr.io/courage-zen/agents-with-multica-code-writer-ts:${{ steps.version.outputs.CODE_WRITER_TS_VERSION }}-amd64 | gzip > agents-with-multica-code-writer-ts-amd64.tar.gz

          docker pull --platform linux/arm64 ghcr.io/courage-zen/agents-with-multica-code-writer-ts:${{ steps.version.outputs.CODE_WRITER_TS_VERSION }}-arm64
          docker save ghcr.io/courage-zen/agents-with-multica-code-writer-ts:${{ steps.version.outputs.CODE_WRITER_TS_VERSION }}-arm64 | gzip > agents-with-multica-code-writer-ts-arm64.tar.gz

      - name: Pull and save code-writer-go images
        run: |
          docker pull --platform linux/amd64 ghcr.io/courage-zen/agents-with-multica-code-writer-go:${{ steps.version.outputs.CODE_WRITER_GO_VERSION }}-amd64
          docker save ghcr.io/courage-zen/agents-with-multica-code-writer-go:${{ steps.version.outputs.CODE_WRITER_GO_VERSION }}-amd64 | gzip > agents-with-multica-code-writer-go-amd64.tar.gz

          docker pull --platform linux/arm64 ghcr.io/courage-zen/agents-with-multica-code-writer-go:${{ steps.version.outputs.CODE_WRITER_GO_VERSION }}-arm64
          docker save ghcr.io/courage-zen/agents-with-multica-code-writer-go:${{ steps.version.outputs.CODE_WRITER_GO_VERSION }}-arm64 | gzip > agents-with-multica-code-writer-go-arm64.tar.gz

      - name: Pull and save code-writer-py images
        run: |
          docker pull --platform linux/amd64 ghcr.io/courage-zen/agents-with-multica-code-writer-py:${{ steps.version.outputs.CODE_WRITER_PY_VERSION }}-amd64
          docker save ghcr.io/courage-zen/agents-with-multica-code-writer-py:${{ steps.version.outputs.CODE_WRITER_PY_VERSION }}-amd64 | gzip > agents-with-multica-code-writer-py-amd64.tar.gz

          docker pull --platform linux/arm64 ghcr.io/courage-zen/agents-with-multica-code-writer-py:${{ steps.version.outputs.CODE_WRITER_PY_VERSION }}-arm64
          docker save ghcr.io/courage-zen/agents-with-multica-code-writer-py:${{ steps.version.outputs.CODE_WRITER_PY_VERSION }}-arm64 | gzip > agents-with-multica-code-writer-py-arm64.tar.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: |
            agents-with-multica-amd64.tar.gz
            agents-with-multica-arm64.tar.gz
            agents-with-multica-npm-amd64.tar.gz
            agents-with-multica-npm-arm64.tar.gz
            agents-with-multica-code-writer-ts-amd64.tar.gz
            agents-with-multica-code-writer-ts-arm64.tar.gz
            agents-with-multica-code-writer-go-amd64.tar.gz
            agents-with-multica-code-writer-go-arm64.tar.gz
            agents-with-multica-code-writer-py-amd64.tar.gz
            agents-with-multica-code-writer-py-arm64.tar.gz
