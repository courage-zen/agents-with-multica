name: Build and Push Code Writer Go Image

on:
  push:
    branches:
      - main
    paths:
      - 'code-writer/go/**'
      - 'code-writer-version.yaml'
      - '.github/workflows/build-code-writer-go.yml'
  pull_request:
    paths:
      - 'code-writer/go/**'
      - 'code-writer-version.yaml'
      - '.github/workflows/build-code-writer-go.yml'

jobs:
  build-code-writer-go:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') || github.event_name == 'pull_request'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract versions
        id: versions
        run: |
          CODE_WRITER_GO_VERSION=$(python3 -c "import yaml; print(yaml.safe_load(open('code-writer-version.yaml'))['code_writer_go']['version'])")
          PROJECT_VERSION=$(python3 -c "import yaml; print(yaml.safe_load(open('versions.yaml'))['project']['version'])")
          SQLC_VERSION=$(python3 -c "import yaml; print(yaml.safe_load(open('code-writer-version.yaml'))['code_writer_go']['sqlc_version'])")
          GOLANGCI_LINT_VERSION=$(python3 -c "import yaml; print(yaml.safe_load(open('code-writer-version.yaml'))['code_writer_go']['golangci_lint_version'])")
          GOOSE_VERSION=$(python3 -c "import yaml; print(yaml.safe_load(open('code-writer-version.yaml'))['code_writer_go']['goose_version'])")
          echo "CODE_WRITER_GO_VERSION=$CODE_WRITER_GO_VERSION" >> $GITHUB_OUTPUT
          echo "PROJECT_VERSION=$PROJECT_VERSION" >> $GITHUB_OUTPUT
          echo "SQLC_VERSION=$SQLC_VERSION" >> $GITHUB_OUTPUT
          echo "GOLANGCI_LINT_VERSION=$GOLANGCI_LINT_VERSION" >> $GITHUB_OUTPUT
          echo "GOOSE_VERSION=$GOOSE_VERSION" >> $GITHUB_OUTPUT

      - name: Build amd64
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./code-writer/go/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/courage-zen/agents-with-multica-code-writer-go:latest-amd64
            ghcr.io/courage-zen/agents-with-multica-code-writer-go:${{ steps.versions.outputs.CODE_WRITER_GO_VERSION }}-amd64
          build-args: |
            BASE_IMAGE=ghcr.io/courage-zen/agents-with-multica-npm:${{ steps.versions.outputs.PROJECT_VERSION }}-amd64
            SQLC_VERSION=${{ steps.versions.outputs.SQLC_VERSION }}
            GOLANGCI_LINT_VERSION=${{ steps.versions.outputs.GOLANGCI_LINT_VERSION }}
            GOOSE_VERSION=${{ steps.versions.outputs.GOOSE_VERSION }}

      - name: Build arm64
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./code-writer/go/Dockerfile
          platforms: linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/courage-zen/agents-with-multica-code-writer-go:latest-arm64
            ghcr.io/courage-zen/agents-with-multica-code-writer-go:${{ steps.versions.outputs.CODE_WRITER_GO_VERSION }}-arm64
          build-args: |
            BASE_IMAGE=ghcr.io/courage-zen/agents-with-multica-npm:${{ steps.versions.outputs.PROJECT_VERSION }}-arm64
            SQLC_VERSION=${{ steps.versions.outputs.SQLC_VERSION }}
            GOLANGCI_LINT_VERSION=${{ steps.versions.outputs.GOLANGCI_LINT_VERSION }}
            GOOSE_VERSION=${{ steps.versions.outputs.GOOSE_VERSION }}
